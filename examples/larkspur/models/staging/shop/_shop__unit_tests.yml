unit_tests:
  - name: test_order_amounts_in_dollars
    description: Cents become dollars and empty discount codes become null.
    model: stg_shop__orders
    given:
      - input: source('shop', 'orders')
        rows:
          - {id: 1, customer_id: 10, order_number: 1001, created_at: '2026-01-01 10:00:00', financial_status: paid, fulfillment_status: fulfilled, sales_channel: web, discount_code: '', shipping_cents: 895, tax_cents: 350, currency: USD}
    expect:
      rows:
        - {order_id: 1, discount_code: null, shipping_amount: 8.95, tax_amount: 3.5}
